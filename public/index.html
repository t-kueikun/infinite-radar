<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#222121" />
    <title>IFSpotters Radar — Live Infinite Flight Tracker</title>
    <meta name="description" content="IFSpotters Radar — Infinite Flight のライブフライトトラッカー" />
    <meta property="og:title" content="IFSpotters Radar" />
    <meta property="og:description" content="Infinite Flight のライブフライトトラッカー。機体の写真は IFSpotters から。" />
    <meta property="og:image" content="https://radar.ifspotters.com/logo.png" />
    <meta property="og:site_name" content="IFSpotters" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" />
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <link rel="preconnect" href="https://ifspotters.com" crossorigin />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="IFSpotters Radar">
        <img src="/logo.png" alt="IFSpotters" width="659" height="220" />
        <span>Radar</span>
      </a>
      <nav class="servers" id="servers" aria-label="Server"></nav>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg>
        <input id="search" type="search" placeholder="Callsign, user, aircraft, VA…" autocomplete="off" spellcheck="false" aria-label="Search flights" />
        <ul class="search-results" id="search-results" role="listbox" hidden></ul>
      </div>
      <div class="status">
        <span class="badge" id="count">—</span>
        <span class="clock" id="clock">--:-- UTC</span>
      </div>
      <div class="me" id="me"></div>
    </header>

    <main class="stage">
      <!-- 位置とサイズは要素に直接書く。Leaflet は起動時に CSS を見て position を上書きするので、
           Safari で app.css の適用が app.js より遅れると高さ 0 の地図になる -->
      <div id="map" aria-label="Live map" style="position: absolute; inset: 0; width: 100%; height: 100%"></div>
      <aside class="panel" id="panel" hidden aria-live="polite"></aside>
      <aside class="panel stats-panel" id="stats" hidden aria-label="Flight stats"></aside>
      <div class="map-tools">
        <button type="button" class="tool-btn" id="stats-btn" hidden title="My flight stats">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z" fill="currentColor"/></svg>
          <span class="txt">My stats</span>
        </button>
        <button type="button" class="tool-btn" id="filter-btn" aria-expanded="false" aria-controls="filter-pop">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="txt">Filters</span><span class="count" id="filter-count" hidden></span>
        </button>
        <button type="button" class="tool-btn" id="atc-btn" aria-expanded="false" aria-controls="atc-pop">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 3h8l-1 4h-6zM7 7h10l-1.5 4h-7zM10 11h4l1 10H9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="txt">ATC</span><span class="count atc" id="atc-count">0</span>
        </button>
      </div>

      <section class="popover" id="filter-pop" aria-label="Filters" hidden>
        <header class="pop-head">
          <h3>Filters</h3>
          <button type="button" class="link-btn" id="filter-reset">Reset</button>
        </header>
        <div class="locked" id="filter-locked" hidden>
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z" fill="currentColor"/></svg>
          <p><b>Sign in to use filters</b>Use your IFSpotters account. Your own flight will also appear in the top bar.</p>
          <a class="btn btn-primary js-signin" href="#">Sign in with IFSpotters</a>
        </div>
        <form class="filter-form" autocomplete="off">
          <div class="field">
            <div class="field-label">Show</div>
            <div class="seg">
              <label><input type="radio" name="status" value="all" checked /><span>All</span></label>
              <label><input type="radio" name="status" value="air" /><span>Airborne</span></label>
              <label><input type="radio" name="status" value="ground" /><span>On ground</span></label>
            </div>
          </div>
          <div class="field">
            <div class="field-label">Altitude <output id="alt-out">Any</output></div>
            <div class="range2">
              <input type="range" name="altMin" min="0" max="45000" step="1000" value="0" aria-label="Minimum altitude" />
              <input type="range" name="altMax" min="0" max="45000" step="1000" value="45000" aria-label="Maximum altitude" />
            </div>
          </div>
          <label class="field">
            <span class="field-label">Aircraft</span>
            <input type="search" name="aircraft" list="dl-aircraft" placeholder="e.g. A350, 777" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label">Airline / livery</span>
            <input type="search" name="airline" list="dl-airline" placeholder="e.g. Japan Airlines" spellcheck="false" />
          </label>
          <label class="field">
            <span class="field-label">Virtual airline</span>
            <input type="search" name="va" list="dl-va" placeholder="VA / VO name" spellcheck="false" />
          </label>
          <div class="field">
            <label class="field-label" for="filter-airport">Airport (flight plan)</label>
            <div class="airport-row">
              <input type="search" id="filter-airport" name="airport" placeholder="ICAO" maxlength="4" spellcheck="false" />
              <div class="seg">
                <label><input type="radio" name="direction" value="both" checked /><span>Both</span></label>
                <label><input type="radio" name="direction" value="in" /><span>Arr</span></label>
                <label><input type="radio" name="direction" value="out" /><span>Dep</span></label>
              </div>
            </div>
          </div>
          <div class="field">
            <div class="field-label">Airport pins</div>
            <div class="seg">
              <label><input type="radio" name="airports" value="all" checked /><span>All</span></label>
              <label><input type="radio" name="airports" value="atc" /><span>ATC only</span></label>
              <label><input type="radio" name="airports" value="none" /><span>Off</span></label>
            </div>
          </div>
          <datalist id="dl-aircraft"></datalist>
          <datalist id="dl-airline"></datalist>
          <datalist id="dl-va"></datalist>
        </form>
        <footer class="pop-foot" id="filter-result"></footer>
      </section>

      <section class="popover" id="atc-pop" aria-label="Active ATC" hidden></section>

      <div class="toast" id="toast" role="status" hidden></div>
      <div class="map-tooltip" id="tooltip" hidden></div>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
